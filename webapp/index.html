<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>CV - Generator</title>
    <style>
        html,
        body,
        body>div,
        #container,
        #container-uiarea {
            height: 100%;
        }
    </style>

    <script id="sap-ui-bootstrap"
        src="https://ui5.sap.com/1.120.0/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-resource-roots='{
            "cv.viewer.cvviewer": "./"
        }'
        data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compat-version="edge"
        data-sap-ui-async="true"
        data-sap-ui-frame-options="trusted"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script>
        window.addEventListener("load", function () {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach((entry, index) => {
                    if (entry.isIntersecting) {
                        setTimeout(() => entry.target.classList.add("animate"), index * 100);
                    }
                });
            }, { threshold: 0.15, rootMargin: "0px 0px -100px 0px" });

            document.querySelectorAll(".cvSection, .cvStats, .cvSkillCard, .cvTechItem, .cvExpCard, .cvProjectCard, .cvLangCard").forEach(el => {
                observer.observe(el);
            });
        });
    </script>
</head>

<body class="sapUiBody sapUiSizeCompact" id="content">
    <div
        data-sap-ui-component
        data-name="cv.viewer.cvviewer"
        data-id="container"
        data-settings='{"id" : "cv.viewer.cvviewer"}'
        data-handle-validation="true"></div>
</body>

</html>
